<html>
<head>
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Password Generator</h1>

        <div class="output-box">
            <input type="text" id="password" readonly placeholder="Your password">
            <button id="copyBtn">Copy</button>
        </div>

        <div class="setting">
            <label>Password Length: <span id="lengthValue">12</span></label>
            <input type="range" id="length" min="4" max="30" value="12">
        </div>

        <div class="setting">
            <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
        </div>

        <div class="setting">
            <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
        </div>

        <div class="setting">
            <label><input type="checkbox" id="numbers" checked> Numbers</label>
        </div>

        <div class="setting">
            <label><input type="checkbox" id="symbols" checked> Special Characters</label>
        </div>

        <button id="generateBtn" class="generate-btn">Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>
